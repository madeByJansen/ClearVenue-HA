---
# ClearVenue as a Home Assistant app.
#
# The comments say why each field that is not boilerplate is set as it is — because the
# interesting half of this file is what it does *not* ask for.
#
# Channel-specific identity. There are no legacy installs, so ClearVenue uses its product name as the stable slug.
name: ClearVenue
# Written by the pipeline, not by hand: YYYYMMDD.NN from the build's UTC date and the tags
# already in the GHCR package, the same scheme ClearSignage releases use. It is committed
# back here after a successful publish, so this line is the record of what was published —
# and it has to be a literal, because the Supervisor parses this manifest, tracks an
# installed app by this version and pulls image:<version>.
#
# Editing it by hand only makes sense to repair a release the pipeline published but could
# not record; setting it to a version that was never published leaves every install failing
# at the pull.
version: "20261005.01"
# Each channel has its own slug so stable, beta and dev keep independent /data.
slug: clearvenue
description: >-
  Run ClearVenue and one or more ClearSignage screens inside Home Assistant, and let this machine be your
  venue's source of truth for live data — till prices, and how busy your spaces are. Each
  screen is a complete, independent signage player with its own content library, managed on
  itself.
url: https://github.com/madeByJansen/ClearVenue-HA
# A prebuilt image, not a local build. The Supervisor can build an app on the user's own
# machine, and for a public add-on that is friendlier — but this image is built from a
# *private* repository, so a local build would need ClearSignage credentials to exist on
# every customer's Home Assistant. Publishing keeps the source private, turns a ten-minute
# compile on a CM4 into a pull, and means every install runs the bytes that were tested.
#
# One multi-arch manifest, deliberately without the `{arch}` placeholder: that form is
# deprecated, and a manifest list lets the Supervisor pull the right layer itself.
#
# The registry is private. Home Assistant stores per-registry credentials of its own
# (Supervisor's `docker/registries` API), so ghcr.io read access is configured once per
# install and never appears in this file.
image: ghcr.io/madebyjansen/clearvenue
# HA Yellow is a CM4 (aarch64); amd64 covers a NUC or a VM. 32-bit Arm is deliberately
# absent — HA OS dropped it, and the device dependency pins are resolved against
# manylinux aarch64/x86_64 wheels (see ClearSignage's `make device-lock`).
arch:
  - aarch64
  - amd64

# The Supervisor terminates ingress and hands the app an authenticated operator. This is
# the entry path that carries authority, and the only one that does.
ingress: true
ingress_port: 8099
panel_icon: mdi:television-play
panel_title: ClearVenue
# Admin-only: the panel leads to screens that can be reconfigured, and the venue treats an
# authenticated Home Assistant user as the authority for a live-state write.
panel_admin: true

# Required, not merely convenient. A hosted screen is a full LAN peer: it answers
# UDP 9876 discovery, is reached by peers at <host-ip>:810N for /sync/*, and publishes a
# .local name. None of that is expressible through port mapping, because peers
# address the *host*, not a container port.
#
# The consequence is stated here rather than discovered later: with host_network the
# instance ports are directly reachable on the LAN, so that path deliberately carries no
# authority.
host_network: true

# The host's avahi publishes each screen's <name>.local. Home Assistant OS already
# owns 5353 — it is what answers homeassistant.local — so the app talks to that daemon
# over D-Bus rather than running a second one that would contend for the port and lose.
host_dbus: true

# /data is mounted persistently for every app without being asked for, and it is the only
# storage this app uses: /data/instances.json is the fleet, /data/instances/<n>/ is one
# screen's whole world. No `map:` entry, because the app has no business in Home
# Assistant's configuration, its SSL certificates, or its media.

startup: application
boot: auto
# The HA base images run s6-overlay as init; Docker's own would fight it.
init: false

# The fleet page answering is the honest liveness signal: it is served by the supervisor,
# and a supervisor that cannot serve it cannot start or proxy a screen either.
#
# Deliberately *not* wired to whether the venue can read its own database: a
# restart does not mend a damaged one, and reporting unhealthy would have the Supervisor
# restarting this box in a loop while the person who needs to press *start again* cannot
# reach the page that offers it.
watchdog: "http://[HOST]:[PORT:8099]/"

# **A file-level copy of a live database is not a backup**. The venue writes its
# state as three files at once — the database, its write-ahead log and the shared index —
# and the Supervisor copies them moments apart while the kitchen is still pressing buttons.
# What comes back is a database missing the last few hours, or one SQLite will not open.
#
# So the live database is left out, and `backup_pre` writes a copy that *is* consistent:
# `clearvenue.store.handover` goes through SQLite's online backup API, which reads through a
# transaction and captures the log. The copy is what the Supervisor takes, and the venue
# adopts it on the next start when a restore has left it no database of its own.
#
# The hook exits non-zero when it cannot write one, because a backup with no venue data in
# it looks exactly like a backup that worked. A venue that has no database at all — a box
# nobody has used yet — hands over nothing and exits zero: there is nothing to lose, and
# failing every backup of an empty venue to catch a misconfiguration it does not have is the
# worse trade. The add-on's own Settings page reports when a copy was last handed over.
backup_exclude:
  - venue.sqlite3
  - venue.sqlite3-wal
  - venue.sqlite3-shm
  # A database a repair moved aside because it would not open. It stays on the box for a
  # recovery tool to read; putting a second whole venue in every snapshot until somebody
  # deletes it is not what a backup is for.
  - venue.sqlite3.damaged
  # The hand-over copy is written under this name and moved into place, so this only exists
  # where an earlier hook died part way through. It is rubbish by definition.
  - venue-for-backup.sqlite3.partial
  # An operator's own copies, kept for their own reasons and rotated on their own rule.
  # Backing them up would put several copies of the venue in every snapshot.
  - copies/
backup_pre: /opt/venv/bin/python -m clearvenue.backup_hook

options:
  # Empty means "this venue works it out for itself at start-up". Stated explicitly where a
  # host has several networks and the wrong one would have every screen advertise an
  # endpoint that resolves nowhere useful.
  #
  # **Worth stating on a box running a VPN.** The venue prefers an ordinary local address
  # over a VPN one, but the operator knows which
  # network the screens are on and this setting is how they say so.
  host_ip: ""
  # Empty means this venue is reached only inside the building. Set it to the https address
  # a reverse proxy publishes the venue at, with the proxy pointed at port 8098 on this
  # machine: the venue then answers there too, signs people in there only with an identity
  # provider, and serves there nothing it trusts because it is in the building.
  public_url: ""
  log_level: info

schema:
  host_ip: "str?"
  public_url: "str?"
  log_level: "list(trace|debug|info|notice|warning|error|fatal)"
