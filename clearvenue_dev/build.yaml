---
# Debian rather than Alpine, and that is a decision rather than a preference.
#
# ClearSignage's device dependencies are pinned in device/constraints.txt and every pin
# is resolved against **manylinux** aarch64/x86_64 wheels — that is stated in the
# repo's own `device-lock` target and is what keeps an appliance install reproducible.
# Alpine is musl, so none of those wheels apply: Pillow and cryptography would be built
# from source at image-build time, on both architectures, for no benefit. Debian keeps
# the hosted image installing the *same* artifacts an appliance does, which is the whole
# premise of hosting — a hosted instance is an appliance pointed somewhere else.
build_from:
  aarch64: ghcr.io/home-assistant/aarch64-base-debian:bookworm
  amd64: ghcr.io/home-assistant/amd64-base-debian:bookworm
