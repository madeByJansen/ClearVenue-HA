name: Build Home Assistant app

on:
  workflow_dispatch:
    inputs:
      channel:
        description: ClearVenue release channel
        required: true
        default: stable
        type: choice
        options:
          - stable
          - beta
          - dev
      clearsignage_ref_override:
        description: Optional full 40-character upstream commit SHA (publishing requires channel approval pin)
        required: false
        default: ""
        type: string
      push:
        description: Push the manifest; when disabled, build and discard both architectures
        required: true
        default: true
        type: boolean

# Version selection reads the registry before publishing, so release runs must not overlap.
concurrency:
  group: clearvenue-homeassistant-release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  # OCI repository names are lowercase, irrespective of the GitHub display name.
  CHANNEL: ${{ inputs.channel }}

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # The workflow token stays configured for origin: recording the version pushes to main
      # with it, and pruning deletes the tags of releases whose images are gone.
      - name: Check out packaging repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install packaging test dependencies
        run: python -m pip install --upgrade pip pytest pyyaml

      - name: Validate packaging
        run: python -m pytest tests -q

      - name: Select channel
        run: |
          python scripts/sync-channel-packaging.py --check
          source scripts/channel-env.sh
          printf '%s\n' "ADDON_DIR=${ADDON_DIR}" "SOURCE_BRANCH=${SOURCE_BRANCH}" "IMAGE=${IMAGE}" >> "${GITHUB_ENV}"

      - name: Require packaging main for publishing
        if: inputs.push
        run: test "${GITHUB_REF}" = refs/heads/main

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          name: clearvenue
          driver: docker-container

      - name: Fetch ClearSignage source
        id: source
        env:
          CLEARSIGNAGE_REF_OVERRIDE: ${{ inputs.clearsignage_ref_override }}
          GITHUB_USERNAME: x-access-token
          GITHUB_TOKEN: ${{ secrets.CLEARSIGNAGE_PAT }}
        run: |
          set -euo pipefail

          ASKPASS_SCRIPT="$(mktemp)"
          trap 'rm -f "${ASKPASS_SCRIPT}"' EXIT
          cat > "${ASKPASS_SCRIPT}" <<'EOF'
          #!/usr/bin/env bash
          case "$1" in
              *Username*) printf '%s\n' "${GITHUB_USERNAME}" ;;
              *Password*) printf '%s\n' "${GITHUB_TOKEN}" ;;
              *) exit 1 ;;
          esac
          EOF
          chmod 700 "${ASKPASS_SCRIPT}"
          export GIT_ASKPASS="${ASKPASS_SCRIPT}"
          export GIT_TERMINAL_PROMPT=0

          ./scripts/fetch-source.sh
          printf 'revision=%s\n' "$(cat "${ADDON_DIR}/src/CLEARSIGNAGE_REF")" >> "${GITHUB_OUTPUT}"

      - name: Check whether publishing is allowed
        env:
          PUSH: ${{ inputs.push }}
          OVERRIDE: ${{ inputs.clearsignage_ref_override }}
          RESOLVED_REF: ${{ steps.source.outputs.revision }}
        run: |
          ./scripts/check-publish-allowed.py \
            --push "${PUSH}" \
            --channel "${CHANNEL}" \
            --branch "${SOURCE_BRANCH}" \
            --override "${OVERRIDE}" \
            --built-revision "${RESOLVED_REF}" \
            --release-file "${ADDON_DIR}/release.yaml"

      - name: Choose app version
        id: version
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(./scripts/next-image-version.py \
            --channel "${CHANNEL}")"
          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"
          echo "Building ClearSignage ${{ steps.source.outputs.revision }} as app version ${version}"

      # The signed screen release this venue hands to the screens that joined it, the same
      # step jenkinsfile-ha runs. A published image must carry one, so publishing without the
      # UPDATE_SIGNING_PRIVATE_KEY secret stops here.
      - name: Build the screen release
        env:
          SCREEN_RELEASE_VERSION: ${{ steps.version.outputs.version }}
          CLEARSIGNAGE_REF: ${{ steps.source.outputs.revision }}
          SCREEN_RELEASE_REQUIRED: ${{ inputs.push }}
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
          GITHUB_USERNAME: x-access-token
          GITHUB_TOKEN: ${{ secrets.CLEARSIGNAGE_PAT }}
        run: |
          set -euo pipefail

          ASKPASS_SCRIPT="$(mktemp)"
          trap 'rm -f "${ASKPASS_SCRIPT}"' EXIT
          cat > "${ASKPASS_SCRIPT}" <<'EOF'
          #!/usr/bin/env bash
          case "$1" in
              *Username*) printf '%s\n' "${GITHUB_USERNAME}" ;;
              *Password*) printf '%s\n' "${GITHUB_TOKEN}" ;;
              *) exit 1 ;;
          esac
          EOF
          chmod 700 "${ASKPASS_SCRIPT}"
          export GIT_ASKPASS="${ASKPASS_SCRIPT}"
          export GIT_TERMINAL_PROMPT=0

          python -m pip install --quiet cryptography pydantic
          ./scripts/build-screen-release.sh

      # The ClearVenue bundle: the image is built from its contents, and it is published
      # beside the image for venues that are not run by Home Assistant. jenkinsfile-ha runs
      # the same step; a published bundle must be signed.
      - name: Build the venue bundle
        env:
          BUNDLE_VERSION: ${{ steps.version.outputs.version }}
          BUNDLE_REQUIRED: ${{ inputs.push }}
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
        run: ./scripts/build-venue-bundle.sh

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build both architectures
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          RESOLVED_REF: ${{ steps.source.outputs.revision }}
          PUSH: ${{ inputs.push }}
        run: |
          set -euo pipefail

          build_from() {
              python - "$1" <<'PY'
          import sys
          import os
          import yaml

          with open(os.environ["ADDON_DIR"] + "/build.yaml", encoding="utf-8") as file:
              print(yaml.safe_load(file)["build_from"][sys.argv[1]])
          PY
          }

          if [ "${PUSH}" = "true" ]; then
              output_mode=(--push)
          else
              output_mode=(--output=type=cacheonly)
          fi

          build_one() {
              local platform="$1" build_base="$2" arch_tag="$3"
              docker buildx build \
                --builder clearvenue \
                --platform "${platform}" \
                --build-arg "BUILD_FROM=${build_base}" \
                --build-arg "CLEARSIGNAGE_REF=${RESOLVED_REF}" \
                --label "org.opencontainers.image.revision=${RESOLVED_REF}" \
                --label "org.opencontainers.image.version=${APP_VERSION}" \
                --tag "${IMAGE}:${APP_VERSION}-${arch_tag}" \
                "${output_mode[@]}" \
                "${ADDON_DIR}"
          }

          build_one linux/arm64 "$(build_from aarch64)" aarch64
          build_one linux/amd64 "$(build_from amd64)" amd64

      - name: Publish and inspect multi-architecture manifest
        if: inputs.push
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE}:${APP_VERSION}" \
            --tag "${IMAGE}:latest" \
            "${IMAGE}:${APP_VERSION}-aarch64" \
            "${IMAGE}:${APP_VERSION}-amd64"
          docker buildx imagetools inspect "${IMAGE}:${APP_VERSION}"

      - name: Publish the venue bundle
        if: inputs.push
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/push-venue-bundle.py --channel "${CHANNEL}" --version "${APP_VERSION}"

      - name: Record the published version
        if: inputs.push
        env:
          RECORD_BRANCH: main
          RECORD_VERSION: ${{ steps.version.outputs.version }}
          GIT_USERNAME: x-access-token
          GIT_PASSWORD: ${{ github.token }}
        run: |
          set -euo pipefail

          ASKPASS_SCRIPT="$(mktemp)"
          trap 'rm -f "${ASKPASS_SCRIPT}"' EXIT
          cat > "${ASKPASS_SCRIPT}" <<'EOF'
          #!/usr/bin/env bash
          case "$1" in
              *Username*) printf '%s\n' "${GIT_USERNAME}" ;;
              *Password*) printf '%s\n' "${GIT_PASSWORD}" ;;
              *) exit 1 ;;
          esac
          EOF
          chmod 700 "${ASKPASS_SCRIPT}"
          export GIT_ASKPASS="${ASKPASS_SCRIPT}"
          export GIT_TERMINAL_PROMPT=0

          ./scripts/record-published-version.sh

      # Old images and bundles, and the tags of the releases they were. Deleting a tag is a
      # push, made with the credentials the checkout kept.
      - name: Prune old releases
        if: inputs.push
        env:
          GHCR_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./scripts/prune-ghcr-releases.py \
            --channel "${CHANNEL}" --current "${APP_VERSION}" --apply

      - name: Remove private source
        if: always()
        run: rm -rf clearvenue/src clearvenue_beta/src clearvenue_dev/src .upstream venue-release
